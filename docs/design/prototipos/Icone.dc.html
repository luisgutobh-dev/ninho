<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ícone de categoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: {{px}}; height: {{px}}; color: {{color}}">
  <sc-if value="{{isEscola}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l9-3 9 3-9 3z"/><path d="M7 8v5c0 1.5 2.5 3 5 3s5-1.5 5-3V8"/><path d="M21 6v6"/></svg></sc-if>
  <sc-if value="{{isSaude}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg></sc-if>
  <sc-if value="{{isAniversario}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="1.5"/><path d="M4 13h16M12 9v11"/><path d="M12 9C10 5 6.5 6 7.5 8.5M12 9c2-4 5.5-3 4.5-.5"/></svg></sc-if>
  <sc-if value="{{isCasa}}" hint-placeholder-val="{{ true }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></sc-if>
  <sc-if value="{{isLazer}}" hint-placeholder-val="{{ false }}"><svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icon":{"editor":"enum","options":["escola","saude","aniversario","casa","lazer"],"default":"casa"},"size":{"editor":"int","default":20},"color":{"editor":"color","default":"#2B2620"},"$preview":{"width":40,"height":40}}'>
class Component extends DCLogic {
renderVals() {
const n = this.props.icon || 'casa';
const size = parseInt(this.props.size || 20, 10) || 20;
return {
isEscola: n === 'escola', isSaude: n === 'saude', isAniversario: n === 'aniversario', isCasa: n === 'casa', isLazer: n === 'lazer',
size: size, px: size + 'px', color: this.props.color || '#2B2620'
};
}
}
</script>
</body>
</html>
